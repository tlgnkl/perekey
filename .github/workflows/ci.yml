name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Whether a pull request touches what the release build is made of.
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE" ]]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(Package\.swift|Package\.resolved|scripts/|\.github/|Support/|Sources/|data/)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the benchmark builds the base commit too
      - run: swift --version
      - run: scripts/check-strings.sh
      - run: swift build
      - run: scripts/test.sh
      - name: Cache the model and held-out data
        uses: actions/cache@v4
        with:
          path: .build/data-cache
          # The pinned revisions and hashes live in the script itself.
          key: data-cache-${{ hashFiles('scripts/fetch-data.sh', 'scripts/wiki-freq.py') }}
      - run: scripts/fetch-data.sh lexicon wikifreq heldout
      - name: Build the model files and check their hashes
        run: scripts/build-model.sh
      - name: Evaluate the classifier on the held-out sample
        run: scripts/eval.sh
      - run: scripts/bundle.sh
      - name: Benchmark InputMachine against the base commit
        run: scripts/bench.sh
        env:
          BENCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # The no-Xcode path: Command Line Tools only, as in docs/PLAN.md and the
  # local setup. A pinned image keeps the toolchain from changing under us.
  clt-only:
    runs-on: macos-latest # needs the macOS 26 SDK (Liquid Glass, Swift 6.2+), like the build job
    steps:
      - uses: actions/checkout@v4
      - name: Select Command Line Tools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools
      - run: xcode-select -p
      - run: swift --version
      - run: swift build
      - name: Where Swift Testing lives in these Command Line Tools
        run: find /Library/Developer/CommandLineTools -maxdepth 7 -name 'Testing*' | head -20
      - run: scripts/test.sh

  # Voice input, built only with PEREKEY_VOICE=1 (Package.swift); releases set it too.
  # Its own scratch path, as locally; its pins in Support/voice/Package.resolved.
  voice:
    runs-on: macos-latest
    env:
      PEREKEY_VOICE: 1
    steps:
      - uses: actions/checkout@v4
      # Speech models are downloaded only by the app's own model store, with
      # checksums; the loaders of FluidAudio and WhisperKit stay unused.
      - name: No model loaders of FluidAudio or WhisperKit in Sources/
        run: scripts/check-voice-loaders.sh
      # Prints swift --version: the pins are compared, not the whole file.
      - name: The voice pins match Package.swift
        run: scripts/voice-pins.sh check
      - run: swift build --scratch-path .build/voice
      - run: scripts/test.sh

  # The release configuration, as release.yml builds it: universal, with voice
  # input, packed into a DMG. Ad hoc signed, since the signing secrets live in
  # the release environment. Fails here, not on the tag, when a slice stops
  # compiling or the app loses what voice needs (scripts/check-release-app.sh).
  release-build:
    # About 13 minutes: runs on main, by hand, and on pull requests that touch
    # what the release build is made of.
    if: github.event_name != 'pull_request' || needs.changes.outputs.release == 'true'
    needs: changes
    runs-on: macos-26 # as in release.yml
    env:
      PEREKEY_VOICE: 1
      SIGN_IDENTITY: "-"
      VERSION: 0.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Select Command Line Tools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools
      - name: Cache the model data
        uses: actions/cache@v4
        with:
          path: .build/data-cache
          key: data-cache-${{ hashFiles('scripts/fetch-data.sh', 'scripts/wiki-freq.py') }}
      - run: scripts/fetch-data.sh lexicon wikifreq
      - run: scripts/build-model.sh --out .build/universal/model
      - run: scripts/check-voice-loaders.sh
      - run: scripts/voice-pins.sh use
      - run: scripts/build-universal.sh
      - run: scripts/check-release-app.sh
      - run: scripts/dmg.sh .build/voice-universal/app/Perekey.app
