# Deploys site/ to GitHub Pages. In the repository settings, set
# Pages > Source to "GitHub Actions" once.
# The Sparkle appcast (SUFeedURL, https://tlgnkl.github.io/perekey/appcast.xml)
# goes into the same artifact: appcast.xml of the latest release, which
# release.yml writes and then starts this workflow. See docs/release.md.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Take the appcast from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir site --clobber \
            || echo "No release with appcast.xml yet."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
