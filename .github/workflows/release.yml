# Release: on a v* tag, build a universal app, pack a DMG, optionally sign and
# notarize it, write the signed Sparkle appcast, attach everything to the
# GitHub release, and publish the appcast on GitHub Pages.
#
# Secrets (all optional; a missing secret skips its step, and the release is
# then an unsigned preview build):
#   DEVELOPER_ID_CERT_P12      base64 of the Developer ID Application .p12
#   DEVELOPER_ID_CERT_PASSWORD password of that .p12
#   DEVELOPER_ID_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD
#                              Apple ID, team ID and app-specific password for notarytool
#   SPARKLE_ED_PRIVATE_KEY     Sparkle EdDSA private key (docs/release.md has the exact command)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Starts pages.yml, which publishes the new appcast.xml.
  actions: write

# Sparkle's tools come from the same zip and checksum as the binaryTarget in
# Package.swift (scripts/appcast.sh reads them there), so there is no second
# version to keep in step.

jobs:
  release:
    runs-on: macos-26 # the macOS 26 SDK and Swift 6.2+ (Liquid Glass, isolated deinit), as in ci.yml
    steps:
      - uses: actions/checkout@v4
      - name: Select Command Line Tools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools
      # Voice input stays out of releases until it ships (Package.swift).
      - name: No voice in the release
        run: |
          if [[ -n "${PEREKEY_VOICE:-}" ]]; then
            echo "::error::PEREKEY_VOICE is set; releases build without voice input"
            exit 1
          fi
      - name: Read the version from the tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      # Fails before the long build if CHANGELOG.md has no dated section for
      # this version ("## [0.1.0] - 2026-10-11").
      - name: Check the release notes
        run: |
          scripts/release-notes.sh "$VERSION" >/dev/null
          grep -qE "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::Put the release date on \"## [$VERSION]\" in CHANGELOG.md"; exit 1; }
      - name: Cache the model data
        uses: actions/cache@v4
        with:
          path: .build/data-cache
          key: data-cache-${{ hashFiles('scripts/fetch-data.sh', 'scripts/wiki-freq.py') }}
      - run: scripts/fetch-data.sh lexicon wikifreq
      # Everything that downloads or runs third-party build tools (the pinned
      # pip packages of scripts/wiki-freq.py) goes before the certificate is
      # in an unlocked keychain. scripts/build-universal.sh then finds the
      # files and only checks their hashes.
      - name: Build the model files and check their hashes
        run: scripts/build-model.sh --out .build/universal/model
      # Fetches Sparkle's zip. Voice input stays out of releases until it
      # ships, and its pins are not at the package root, so nothing else.
      - name: Resolve the packages
        run: |
          for arch in arm64 x86_64; do
            swift package resolve --scratch-path ".build/universal/$arch"
          done

      - name: Import the Developer ID certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          if [[ -z "$CERT_P12" || -z "$IDENTITY" ]]; then
            echo "No Developer ID secrets: the build stays ad hoc signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/release.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Universal build
        run: scripts/build-universal.sh
      - name: No speech engines in the app
        run: |
          bin=.build/universal/app/Perekey.app/Contents/MacOS/Perekey
          for arch in arm64 x86_64; do
            symbols="$(nm -arch "$arch" "$bin")"
            if grep -qE 'FluidAudio|WhisperKit' <<< "$symbols"; then
              echo "::error::The $arch slice links FluidAudio or WhisperKit"
              exit 1
            fi
          done
      - name: DMG
        run: scripts/dmg.sh

      - name: Notarize and staple
        id: notary
        if: steps.cert.outputs.signed == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [[ -z "$NOTARY_APPLE_ID" || -z "$NOTARY_PASSWORD" ]]; then
            echo "No notarization secrets: skipping."
            exit 0
          fi
          dmg=".build/dmg/Perekey-$VERSION.dmg"
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          xcrun stapler staple "$dmg"
          # The stapled DMG changed, so its checksum did too.
          (cd .build/dmg && shasum -a 256 "Perekey-$VERSION.dmg" > "Perekey-$VERSION.dmg.sha256")
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Appcast for Sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "No SPARKLE_ED_PRIVATE_KEY: no appcast entry for this release."
            exit 0
          fi
          # Signs the DMG with EdDSA and writes .build/appcast/appcast.xml (docs/release.md).
          TAG="$GITHUB_REF_NAME" scripts/appcast.sh ".build/dmg/Perekey-$VERSION.dmg"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Unsigned builds get the "Open Anyway" steps in their notes.
          SIGNED: ${{ steps.notary.outputs.notarized == 'true' }}
        run: |
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          # The same DMG under a fixed name: README and the site link to
          # releases/latest/download/Perekey.dmg, which always is the newest one.
          cp ".build/dmg/Perekey-$VERSION.dmg" .build/dmg/Perekey.dmg
          files=(".build/dmg/Perekey-$VERSION.dmg" ".build/dmg/Perekey-$VERSION.dmg.sha256" .build/dmg/Perekey.dmg)
          [[ -f .build/appcast/appcast.xml ]] && files+=(.build/appcast/appcast.xml)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "Perekey $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Publish the appcast on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        # pages.yml takes appcast.xml from the release GitHub marks "Latest"
        # (never a prerelease) and serves it at SUFeedURL.
        run: |
          [[ -f .build/appcast/appcast.xml ]] || exit 0
          gh workflow run pages.yml --ref main
