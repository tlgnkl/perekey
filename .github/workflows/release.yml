# Release: on a v* tag, build a universal app, pack a DMG, sign it and
# notarize it when it can, write the signed Sparkle appcast, attach everything
# to the GitHub release, and publish the appcast on GitHub Pages.
#
# The job runs in the GitHub environment "release", which waits for the
# owner's approval; the signing secrets live there (docs/release.md).
#
# Secrets (all optional; a missing secret skips its step). The app is signed
# with the first identity whose secrets are set:
#   1. Developer ID, then notarized:
#   DEVELOPER_ID_CERT_P12      base64 of the Developer ID Application .p12
#   DEVELOPER_ID_CERT_PASSWORD password of that .p12
#   DEVELOPER_ID_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD
#                              Apple ID, team ID and app-specific password for notarytool
#   2. "Perekey Release", self-signed (scripts/release-cert.sh); not notarized:
#   PEREKEY_RELEASE_CERT_P12      base64 of its .p12
#   PEREKEY_RELEASE_CERT_PASSWORD password of that .p12
#   3. Neither: ad hoc.
#   SPARKLE_ED_PRIVATE_KEY     Sparkle EdDSA private key (docs/release.md has the exact command)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Starts pages.yml, which publishes the new appcast.xml.
  actions: write

# Sparkle's tools come from the same zip and checksum as the binaryTarget in
# Package.swift (scripts/appcast.sh reads them there), so there is no second
# version to keep in step.

jobs:
  release:
    environment: release
    runs-on: macos-26 # the macOS 26 SDK and Swift 6.2+ (Liquid Glass, isolated deinit), as in ci.yml
    steps:
      - uses: actions/checkout@v4
      - name: Select Command Line Tools
        run: sudo xcode-select -s /Library/Developer/CommandLineTools
      - name: Read the version from the tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      # Fails before the long build if CHANGELOG.md has no dated section for
      # this version ("## [0.1.0] - 2026-10-11").
      - name: Check the release notes
        run: |
          scripts/release-notes.sh "$VERSION" >/dev/null
          grep -qE "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::Put the release date on \"## [$VERSION]\" in CHANGELOG.md"; exit 1; }
      - name: Cache the model data
        uses: actions/cache@v4
        with:
          path: .build/data-cache
          key: data-cache-${{ hashFiles('scripts/fetch-data.sh', 'scripts/wiki-freq.py') }}
      - run: scripts/fetch-data.sh lexicon wikifreq
      # Everything that downloads or runs third-party build tools (the pinned
      # pip packages of scripts/wiki-freq.py) goes before the certificate is
      # in an unlocked keychain. scripts/build-universal.sh then finds the
      # files and only checks their hashes.
      - name: Build the model files and check their hashes
        run: scripts/build-model.sh --out .build/universal/model
      # SwiftPM fetches the pins of Package.resolved even without voice input
      # (the release leaves PEREKEY_VOICE unset), and Sparkle's zip with them.
      - name: Resolve the packages
        run: |
          for arch in arm64 x86_64; do
            swift package resolve --scratch-path ".build/universal/$arch"
          done

      # Writes the signing identity to a temporary keychain with a random
      # password; the last step deletes it. Output "signing": developer-id,
      # release or adhoc.
      - name: Import the signing certificate
        id: cert
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          RELEASE_P12: ${{ secrets.PEREKEY_RELEASE_CERT_P12 }}
          RELEASE_PASSWORD: ${{ secrets.PEREKEY_RELEASE_CERT_PASSWORD }}
        run: |
          umask 077 # cert.p12 below
          if [[ -n "$DEVELOPER_ID_P12" && -z "$DEVELOPER_ID_IDENTITY" ]] || [[ -z "$DEVELOPER_ID_P12" && -n "$DEVELOPER_ID_IDENTITY" ]]; then
            echo "::warning::DEVELOPER_ID_CERT_P12 and DEVELOPER_ID_IDENTITY go together: only one is set, so Developer ID is skipped"
          fi
          if [[ -n "$DEVELOPER_ID_P12" && -n "$DEVELOPER_ID_IDENTITY" ]]; then
            signing=developer-id p12="$DEVELOPER_ID_P12" password="$DEVELOPER_ID_PASSWORD" identity="$DEVELOPER_ID_IDENTITY"
          elif [[ -n "$RELEASE_P12" ]]; then
            signing=release p12="$RELEASE_P12" password="$RELEASE_PASSWORD" identity="Perekey Release"
          else
            echo "No signing secrets: the build stays ad hoc signed."
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/release.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$p12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$password" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          # Without -v find-identity lists the self-signed certificate too, as
          # not trusted. codesign refuses an expired one: fail here, by name.
          # DEVELOPER_ID_IDENTITY may be what codesign takes, a SHA-1 or a part
          # of the name; "Perekey Release" is the whole name.
          listing="$(security find-identity -p codesigning "$kc")"
          if [[ "$signing" == release ]]; then
            found="$(grep -F "\"$identity\"" <<< "$listing" || true)"
          else
            found="$(grep -iF "$identity" <<< "$listing" || true)"
          fi
          if [[ -z "$found" || "$found" == *EXPIRED* ]]; then
            echo "::error::No usable \"$identity\" in the certificate: ${found:-missing}"
            exit 1
          fi
          # The full name: bundle.sh and dmg.sh tell Developer ID by its prefix.
          name="$(sed -n '1s/^[^"]*"\(.*\)".*$/\1/p' <<< "$found")"
          echo "SIGN_IDENTITY=$name" >> "$GITHUB_ENV"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"

      - name: Universal build
        run: scripts/build-universal.sh
      - name: DMG
        run: scripts/dmg.sh

      - name: Notarize and staple
        id: notary
        if: steps.cert.outputs.signing == 'developer-id'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [[ -z "$NOTARY_APPLE_ID" || -z "$NOTARY_PASSWORD" ]]; then
            echo "No notarization secrets: skipping."
            exit 0
          fi
          dmg=".build/dmg/Perekey-$VERSION.dmg"
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          xcrun stapler staple "$dmg"
          # The stapled DMG changed, so its checksum did too.
          (cd .build/dmg && shasum -a 256 "Perekey-$VERSION.dmg" > "Perekey-$VERSION.dmg.sha256")
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Appcast for Sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "No SPARKLE_ED_PRIVATE_KEY: no appcast entry for this release."
            exit 0
          fi
          # Signs the DMG with EdDSA and writes .build/appcast/appcast.xml (docs/release.md).
          TAG="$GITHUB_REF_NAME" scripts/appcast.sh ".build/dmg/Perekey-$VERSION.dmg"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Builds Apple has not notarized (ad hoc and "Perekey Release") get
          # the "Open Anyway" steps in their notes.
          SIGNED: ${{ steps.notary.outputs.notarized == 'true' }}
        run: |
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          # The same DMG under a fixed name: README and the site link to
          # releases/latest/download/Perekey.dmg, which always is the newest one.
          cp ".build/dmg/Perekey-$VERSION.dmg" .build/dmg/Perekey.dmg
          files=(".build/dmg/Perekey-$VERSION.dmg" ".build/dmg/Perekey-$VERSION.dmg.sha256" .build/dmg/Perekey.dmg)
          [[ -f .build/appcast/appcast.xml ]] && files+=(.build/appcast/appcast.xml)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "Perekey $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Publish the appcast on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        # pages.yml takes appcast.xml from the release GitHub marks "Latest"
        # (never a prerelease) and serves it at SUFeedURL.
        run: |
          [[ -f .build/appcast/appcast.xml ]] || exit 0
          gh workflow run pages.yml --ref main

      - name: Delete the temporary keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          kc="$RUNNER_TEMP/release.keychain-db"
          [[ -f "$kc" ]] || exit 0
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "$kc"
